[package]
name = "korg-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The image engine (sprint 056). korg-core needs it for the attachment display
# id and the canonical blob-serving paths — both contract facts that must have
# exactly one definition. The dependency points core -> img and never back:
# korg-img knows nothing about Postgres or korg's node model.
korg-img = { path = "../korg-img" }
sqlx = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
ts-rs = { workspace = true }
time = { workspace = true }
jiff = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
korg-test-support = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tokio = { workspace = true }
