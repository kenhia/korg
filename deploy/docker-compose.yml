---
# korg — the deployed run configuration.
#
# THIS FILE IS THE SOURCE OF TRUTH for how the korg container runs. It is
# copied verbatim to /datastore/korg/docker-compose.yml on kubsdb by the
# `deploy-kubsdb` skill, and `docker compose up -d` from that directory is
# what creates the container.
#
# Before WI #842 the run config existed only as a prose table in
# .claude/skills/deploy-kubsdb/SKILL.md, applied by a hand-rolled `docker run`.
# That left every deploy unreviewable — a changed port binding or a dropped env
# var produced no diff anywhere — and it left the container with no
# com.docker.compose.* labels, which a later audit correctly read as "not
# started by compose" and incorrectly read as "no compose file exists".
#
# So: if you change how korg runs, change it HERE.

services:
  korg:
    # Pulled from the homelab docker registry (k-homelab sprint 020, korg
    # #1011) — not loaded over SSH. The reference is the tailnet name on both
    # ends: kai pushes to it and kubsdb pulls from it, and a host-local
    # `localhost:5000` here would name a different image on the build host.
    #
    # Overridable so a rollback is still one command, now against the
    # registry's history rather than whatever kubsdb happens to have cached:
    #   KORG_IMAGE=kubsdb.encke-wahoo.ts.net:5000/korg:<short-sha> docker compose up -d
    image: ${KORG_IMAGE:-kubsdb.encke-wahoo.ts.net:5000/korg:latest}
    container_name: korg

    # Loopback is what `tailscale serve` proxies to; the LAN address serves
    # kwork and anything off-tailnet.
    #
    # NOT 0.0.0.0 — that overlaps tailscaled's own listener on kubsdb's tailnet
    # address, so `up` fails with "address already in use" whenever tailscaled
    # got there first, and the half-created container is left with no network
    # attached, crash-looping on name resolution for `postgresql`. A
    # docker-compose.yml.bak-20260717 making exactly this mistake sat beside the
    # live one on kubsdb until sprint 047 removed it.
    ports:
      - "127.0.0.1:5674:5674"
      - "192.168.1.60:5674:5674"

    # DATABASE_URL and KORG_TIMEZONE only. Resolved relative to this file, so it
    # is /datastore/korg/korg.env once deployed — mode 0600, never in this repo
    # (deploy/korg.env is gitignored). See korg.env.example.
    #
    # KORG_WEB_DIR and KORG_LISTEN_ADDR are deliberately absent: the image sets
    # them via Dockerfile ENV, and duplicating them here would create a second
    # place for them to drift.
    env_file:
      - korg.env

    # The embed allowlist (WI #1468, sprint 070). Here rather than in korg.env
    # because it is **not a secret** and it is a decision about how korg runs —
    # which is what this file is the source of truth for. Putting it in the
    # gitignored env file would make "who may frame korg" unreviewable, which is
    # exactly the failure #842 fixed for the rest of the run config.
    #
    # First entry: kfdc, which serves from this same host on :8100. Same
    # machine, different port, therefore a different origin, therefore this.
    # Program korg:1471 slice 2 (kfdc #1203) is what consumes it.
    #
    # **Not authentication.** This decides which origins a browser will let
    # paint korg; it changes nothing about who may read or write it. korg is
    # unauthenticated by design and the tailnet is the perimeter — do not read
    # this list as an access-control list. Removing the variable does not open
    # korg up, it closes embedding entirely: korg-core defaults to
    # `frame-ancestors 'none'`.
    environment:
      KORG_FRAME_ANCESTORS: "https://kubsdb.encke-wahoo.ts.net:8100"

    # Image attachments (sprint 056, #582/#1119). The bytes are the one part of
    # korg that is NOT in Postgres, so they are the one part a container
    # replacement would otherwise destroy — hence a bind mount rather than a
    # named volume: the path is visible to `ls`, to the nightly gratch sync
    # (slice 3) and to the sensitive-image purge runbook, none of which should
    # have to ask Docker where the data went.
    #
    # /datastore is kubsdb's SSD (sda, ROTA=0) and its established service-data
    # home — decided 2026-08-08 over gratch, which is a spun-down HDD with a
    # ~15s wake and would make serving a thumbnail feel broken.
    #
    # The container side matches the Dockerfile's KORG_IMG_ROOT. Docker creates
    # the host directory root-owned on first `up` if it is missing, and that
    # works — the image declares no USER, so korg-api runs as root and can write
    # it. Pre-create it only if you want it owned by someone else:
    #   sudo install -d -o 1000 -g 1000 /datastore/korg/images
    #
    # NOTE (slice 1): this store has no second copy yet. k-homelab #1122 adds
    # the nightly rsync to /gratch that korg's pg_dump already gets — until then
    # a restored database can reference images that exist nowhere.
    volumes:
      - /datastore/korg/images:/data/images

    networks:
      - kubsdb-net
    restart: unless-stopped

networks:
  # Created by k-homelab's docker-host recipe. korg does not own it and must not
  # create it — an accidentally compose-created kubsdb-net would be a second
  # network of the same name in a different project, and postgresql would not be
  # on it.
  kubsdb-net:
    external: true
