# Installed on the gate Pi as
# /etc/systemd/system/korg-gate.service.d/khomelab-secrets.conf.
#
# On a k-homelab-managed host the owner passphrase is NOT in /etc/korg-gate/env.
# krot's rule is one copy of a secret per host, at /etc/khomelab/secrets.env,
# rendered from the age store by k-homelab's `khomelab-secrets` recipe
# (manifests/krgate.yml declares KORG_GATE_PASSPHRASE: korg-gate-passphrase).
# systemd reads EnvironmentFile= as root before the DynamicUser drop, so the
# file's root:khomelab 0640 mode needs no service account in the group.
[Service]
EnvironmentFile=/etc/khomelab/secrets.env
